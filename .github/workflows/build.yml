name: Mest EQ kurulum dosyasını derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Uygulamayı tek exe olarak derle
        run: >
          dotnet publish MestEQ/MestEQ.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Equalizer APO ve GPL lisans metnini indir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          $exe = "deps/EqualizerAPO-x64-1.4.2.exe"
          $urls = @(
            "https://downloads.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe",
            "https://master.dl.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe?viasf=1",
            "https://netix.dl.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe?viasf=1",
            "https://deac-fra.dl.sourceforge.net/project/equalizerapo/1.4.2/EqualizerAPO-x64-1.4.2.exe?viasf=1",
            "https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download"
          )
          $ok = $false
          foreach ($u in $urls) {
            foreach ($agent in @("Wget/1.21.4", "curl/8.4.0")) {
              Write-Host "Deneniyor: $u ($agent)"
              if (Test-Path $exe) { Remove-Item $exe -Force }
              curl.exe -sSL --retry 3 --retry-delay 3 -A $agent -o $exe $u
              if (Test-Path $exe) {
                $size = (Get-Item $exe).Length
                $head = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))[0..1]
                Write-Host "  boyut: $size bayt"
                if ($size -gt 5MB -and $head[0] -eq 0x4D -and $head[1] -eq 0x5A) { $ok = $true; break }
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Equalizer APO hiçbir kaynaktan indirilemedi." }
          Write-Host "Equalizer APO indirildi."
          curl.exe -sSL --retry 5 -o licenses/GPL-2.0.txt "https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt"

      - name: Kurulum dosyasını oluştur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer/MestEQ.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MestEQ-Setup
          path: installer/Output/MestEQ-Setup.exe
          if-no-files-found: error
